[package]
name = "iksa"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
blake3 = "1.8"
zstd = "0.13"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
